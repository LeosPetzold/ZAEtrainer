  <!-- Top plate -->
  <line x1="52" y1="28" x2="52" y2="100" stroke="#000" stroke-width="2.5"/>
  <!-- Bottom plate -->
  <line x1="76" y1="28" x2="76" y2="100" stroke="#000" stroke-width="2.5"/>
  <line x1="76" y1="64" x2="128" y2="64" stroke="#000" stroke-width="3" stroke-linecap="butt"/>
</svg>
