<!DOCTYPE html>
<html lang="cs">
    <head>
        <title>ZAETrainer</title>
        <meta charset="UTF-8">
        <link href="favicon.ico" rel="icon">

        <!--Styling-->
        <link href="styling/basic.css" rel="stylesheet">
        <link href="styling/bars.css" rel="stylesheet">
        <link id="responsive" href="styling/pc.css" rel="stylesheet">
        <script>
            function loadResponsiveStyle() {
                window.pc = !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                window.mobile = !window.pc;

                const link = document.getElementById('responsive');
                link.href = window.pc ? 'styling/pc.css' : 'styling/mobile.css'
            } loadResponsiveStyle();
            window.addEventListener('resize', loadResponsiveStyle);
        </script>

        <!--Pre-build scripts-->
        <script src="scripts/thirdparty/jQuery.js"></script>
        <script src="scripts/thirdparty/rng.js"></script>
    </head>

    <body>
        <div id="btop">
            <span id="tabs">
                <span class="tabb" active="false" value="tab-knihovna">Knihovna 🕮</span>&emsp;
                <span class="tabb" active="false" value="tab-lekce">Lekce 🖉</span>&emsp;
                <span class="tabb" active="true"  value="tab-editor">Editor ⸎</span>
            </span>
            <separator />
        </div>
        <div id="content">
            <span class="tab" id="tab-knihovna" style="display:none;">
                Knihovna stuff here
            </span>
            <span class="tab" id="tab-lekce" style="display:none;">
                Lekce stuff here
            </span>
            <span class="tab" id="tab-editor" style="display:unset;">
                <link href="styling/tab-editor.css" rel="stylesheet">
            
                <div id="editor-selector">
                    <span id="editor-selector-container">
                        NAČÍTÁM DLAŽDICE ZE SERVERU...
                    </span>
                </div>
                <div id="editor-tiledetails">
                    <!--Tile image wrapper, force 128x128px viewport--><div id="editor-tiledetails-image"></div>
                    <span>
                        <b id="editor-tiledetails-name">?</b>
                        <br><br>
                        Velikost <b id="editor-tiledetails-sizeX">?</b>x<b id="editor-tiledetails-sizeY">?</b>
                        <br>
                        Varianta <b id="editor-tiledetails-variantN">?</b>. z <b id="editor-tiledetails-variantT">?</b>
                        <br>
                        Natočení <b><span id="editor-tiledetails-rotation">?</span>&deg;</b>
                        <br><br>
                        <note><i><b>E</b> mění varianty.
                            <br>
                            <b>R</b> a <b>T</b> natáčí.</i></note>
                    </span>
                </div>
            </span>
        </div>
        <div id="bbot">
            <span>
                <a <!--href="https://zae.leonetwork.eu">
                    zae.leonetwork.eu</a>
                --
                nástroj pro generaci a řešení příkladů ze základů elektrotechniky
                &emsp14;&emsp14;&emsp14;
            </span>
            <span>
                <b>© Leoš Petzold 2026</b>, <a target="_blank" rel="noopener noreferrer" href="https://voskh.cz/">student</a>
            </span>
            <!--<span style="display: inline-flex; align-items: center; gap: 8px; margin-left: auto;">
                <noprint>
                    <a href="terms.html">Podmínky užití, autorská práva</a>
                </noprint>
            </span>-->
        </div>
    </body>

    <!--Post-build scripts-->
    <script src="scripts/ui.js"></script>
    <script src="scripts/build.js"></script>
    
    <!--Tab scripts-->
    <script src="scripts/tab-editor.js"></script>
</html>
