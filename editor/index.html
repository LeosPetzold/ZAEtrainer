<!DOCTYPE html>
<html lang="cs">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ZAETrainer editor schémat</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="topbar">
            ZAETrainer editor schémat
            &emsp14;
            &emsp14;
            <select id="tab" onchange="updateTabs();">
                <option value="schematic" default>Schéma</option>
                <option value="method">Metoda</option>
            </select>
        </div>
        <div id="content">
            <div id="schematic" class="tab-content">
                <div id="viewport" onmousemove="viewportMouseMove(event);" onclick="viewportClick(event);">
                    <div id="indicator">
                        <span id="draggedIndicator"><i>No tile being dragged</i></span><br>
                        <span id="coordsIndicator">ERROR: No coordinates to display</span><br>
                        <span id="rotationIndicator">Rotation: 0°</span>
                    </div>
                </div>
                <div id="menu">
                    
                </div>
            </div>
            <div id="method" class="tab-content" style="display: none;">
                Methodus
            </div>
        </div>
    </body>
    <script src="../scripts/jQuery.js"></script>
    <script src="config.js"></script>
    <script src="schematic.js"></script>
    <script>
        function updateTabs(override=null) { 
            const contentRoot = $("#content")[0];
            const selectedTab = override || $("#tab")[0].value;
            for (let i = 0; i < contentRoot.children.length; i++) {
                contentRoot.children[i].style.display = 'none';
            }
            document.getElementById(selectedTab).style.display = 'block';

            window.schematicMode = selectedTab == "schematic";
            window.methodMode = selectedTab == "method";

        } updateTabs();

        
    </script>
</html>
